services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['sh', '/usr/local/bin/blujet-db-entrypoint']
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-300s}
      - -c
      - archive_command=sh /usr/local/bin/blujet-archive-wal %p %f
    environment:
      POSTGRES_USER: blujet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: blujet
    volumes:
      - db_data:/var/lib/postgresql/data
      - db_wal_archive:/var/lib/postgresql/wal-archive
      - ${BACKUP_DIR:-/opt/app/backups}:/var/lib/postgresql/base-backups
      - ./scripts/database-entrypoint.sh:/usr/local/bin/blujet-db-entrypoint:ro
      - ./scripts/archive-wal.sh:/usr/local/bin/blujet-archive-wal:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blujet']
      interval: 5s
      timeout: 5s
      retries: 10
    # Internal only — never published to the host (CLAUDE.md deployment rules).
    expose:
      - '5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - '6379'

  pss-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blujet_pss
      POSTGRES_PASSWORD: ${PSS_POSTGRES_PASSWORD}
      POSTGRES_DB: blujet_pss
    volumes:
      - pss_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blujet_pss -d blujet_pss']
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - '5432'

  db-migrate:
    image: blujet-backend:${DEPLOY_SHA:-local}
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://blujet:${POSTGRES_PASSWORD}@db:5432/blujet?schema=public
      SEED_ON_START: 'false'
    command: ['npm', 'run', 'migration:run:prod']

  db-runtime-roles:
    image: blujet-backend:${DEPLOY_SHA:-local}
    restart: 'no'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://blujet:${POSTGRES_PASSWORD}@db:5432/blujet?schema=public
      CORE_DATABASE_PASSWORD: ${CORE_DATABASE_PASSWORD:?Supply a separate Core runtime database password}
      SEED_ON_START: 'false'
    command: ['node', 'dist/database/provision-core-runtime-role.js']

  db-offer-reader-role:
    profiles: ['offer']
    image: blujet-backend:${DEPLOY_SHA:-local}
    restart: 'no'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://blujet:${POSTGRES_PASSWORD}@db:5432/blujet?schema=public
      OFFER_DATABASE_PASSWORD: ${OFFER_DATABASE_PASSWORD:-}
      SEED_ON_START: 'false'
    command: ['node', 'dist/database/provision-offer-reader-role.js']

  db-ticketing-refund-reader-role:
    profiles: ['ticketing-refund']
    image: blujet-backend:${DEPLOY_SHA:-local}
    restart: 'no'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://blujet:${POSTGRES_PASSWORD}@db:5432/blujet?schema=public
      TICKETING_REFUND_DATABASE_PASSWORD: ${TICKETING_REFUND_DATABASE_PASSWORD:-}
      SEED_ON_START: 'false'
    command: ['node', 'dist/database/provision-ticketing-refund-reader-role.js']

  db-payment-reconciliation-reader-role:
    profiles: ['payment-reconciliation']
    image: blujet-backend:${DEPLOY_SHA:-local}
    restart: 'no'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://blujet:${POSTGRES_PASSWORD}@db:5432/blujet?schema=public
      PAYMENT_RECONCILIATION_DATABASE_PASSWORD: ${PAYMENT_RECONCILIATION_DATABASE_PASSWORD:-}
      SEED_ON_START: 'false'
    command: ['node', 'dist/database/provision-payment-reconciliation-reader-role.js']

  db-order-booking-reader-role:
    profiles: ['order-booking']
    image: blujet-backend:${DEPLOY_SHA:-local}
    restart: 'no'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://blujet:${POSTGRES_PASSWORD}@db:5432/blujet?schema=public
      ORDER_BOOKING_DATABASE_PASSWORD: ${ORDER_BOOKING_DATABASE_PASSWORD:-}
      SEED_ON_START: 'false'
    command: ['node', 'dist/database/provision-order-booking-reader-role.js']

  db-inventory-reader-role:
    profiles: ['inventory']
    image: blujet-backend:${DEPLOY_SHA:-local}
    restart: 'no'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://blujet:${POSTGRES_PASSWORD}@db:5432/blujet?schema=public
      INVENTORY_DATABASE_PASSWORD: ${INVENTORY_DATABASE_PASSWORD:-}
      SEED_ON_START: 'false'
    command: ['node', 'dist/database/provision-inventory-reader-role.js']

  db-ops-admin-reader-role:
    profiles: ['ops-admin']
    image: blujet-backend:${DEPLOY_SHA:-local}
    restart: 'no'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://blujet:${POSTGRES_PASSWORD}@db:5432/blujet?schema=public
      OPS_ADMIN_DATABASE_PASSWORD: ${OPS_ADMIN_DATABASE_PASSWORD:-}
      SEED_ON_START: 'false'
    command: ['node', 'dist/database/provision-ops-admin-reader-role.js']

  pss-service:
    build:
      context: ./pss-service
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      pss-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3100
      PSS_DATABASE_URL: postgresql://blujet_pss:${PSS_POSTGRES_PASSWORD}@pss-db:5432/blujet_pss?schema=public
      PSS_INTERNAL_TOKEN: ${PSS_INTERNAL_TOKEN}
      SENTRY_DSN: ${PSS_SENTRY_DSN:-}
    expose:
      - '3100'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3100/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notify-service:
    build:
      context: ./notify-service
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3200
      # The notify process must use a dedicated non-superuser role scoped to
      # the notify schema. The core owner URL must never be reused here.
      NOTIFY_DATABASE_URL: ${NOTIFY_DATABASE_URL:?Supply a dedicated notify writer URL}
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      SMS_PROVIDER_TIMEOUT_MS: ${SMS_PROVIDER_TIMEOUT_MS:-10000}
    expose:
      - '3200'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3200/health/ready', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  experience-service:
    build:
      context: ./experience-service
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3300
      # The experience process must use a dedicated non-superuser role scoped
      # to the experience schema. The core owner URL must never be reused here.
      EXPERIENCE_DATABASE_URL: ${EXPERIENCE_DATABASE_URL:?Supply a dedicated experience writer URL}
      EXPERIENCE_INTERNAL_TOKEN: ${EXPERIENCE_INTERNAL_TOKEN}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      EXPERIENCE_UPLOAD_DIR: /app/uploads
    expose:
      - '3300'
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3300/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  reporting-worker:
    profiles: ['reporting']
    build:
      context: ./backend
      dockerfile: Dockerfile.reporting-worker
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3500
      # This process never runs migrations and must not receive the Core owner
      # URL. Schema changes remain an explicit operator-owned migration step.
      REPORTING_DATABASE_URL: ${REPORTING_DATABASE_URL:?Supply a dedicated reporting writer URL}
      REPORTING_KAFKA_CONSUMER_ENABLED: 'true'
      REPORTING_KAFKA_CLIENT_ID: ${REPORTING_KAFKA_CLIENT_ID:-blujet-reporting}
      REPORTING_KAFKA_GROUP_ID: ${REPORTING_KAFKA_GROUP_ID:-blujet-reporting-v1}
      REPORTING_KAFKA_FROM_BEGINNING: ${REPORTING_KAFKA_FROM_BEGINNING:-true}
      REPORTING_KAFKA_MAX_BYTES: ${REPORTING_KAFKA_MAX_BYTES:-262144}
      REPORTING_KAFKA_SASL_MECHANISM: ${REPORTING_KAFKA_SASL_MECHANISM}
      REPORTING_KAFKA_SASL_USERNAME: ${REPORTING_KAFKA_SASL_USERNAME}
      REPORTING_KAFKA_SASL_PASSWORD: ${REPORTING_KAFKA_SASL_PASSWORD}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-blujet.events.v1}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-true}
      KAFKA_TLS_CA_PEM: ${KAFKA_TLS_CA_PEM:-}
    expose:
      - '3500'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3500/ready', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  offer-pricing:
    profiles: ['offer']
    build:
      context: ./backend
      dockerfile: Dockerfile.offer-worker
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db-offer-reader-role:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3600
      OFFER_DATABASE_URL: postgresql://blujet_offer_reader:${OFFER_DATABASE_PASSWORD:-}@db:5432/blujet?schema=public
      OFFER_INTERNAL_TOKEN: ${OFFER_INTERNAL_TOKEN:-}
      CORE_OFFER_SIGNING_SECRET: ${CORE_OFFER_SIGNING_SECRET:-}
      CORE_OFFER_TTL_SECONDS: ${CORE_OFFER_TTL_SECONDS:-900}
      API_REQUEST_TIMEOUT_MS: ${OFFER_API_REQUEST_TIMEOUT_MS:-10000}
      API_MAX_BODY_BYTES: ${OFFER_API_MAX_BODY_BYTES:-262144}
      TRUST_PROXY_HOPS: '0'
      HTTPS_ENABLED: 'false'
    expose:
      - '3600'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3600/health/ready', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ticketing-refund:
    profiles: ['ticketing-refund']
    build:
      context: ./backend
      dockerfile: Dockerfile.ticketing-refund-worker
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db-ticketing-refund-reader-role:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3620
      TICKETING_REFUND_DATABASE_URL: postgresql://blujet_ticketing_refund_reader:${TICKETING_REFUND_DATABASE_PASSWORD:-}@db:5432/blujet?schema=public
      TICKETING_REFUND_INTERNAL_TOKEN: ${TICKETING_REFUND_INTERNAL_TOKEN:-}
      API_REQUEST_TIMEOUT_MS: ${TICKETING_REFUND_API_REQUEST_TIMEOUT_MS:-10000}
      API_MAX_BODY_BYTES: ${TICKETING_REFUND_API_MAX_BODY_BYTES:-262144}
      TRUST_PROXY_HOPS: '0'
      HTTPS_ENABLED: 'false'
    expose:
      - '3620'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3620/health/ready', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  payment-reconciliation:
    profiles: ['payment-reconciliation']
    build:
      context: ./backend
      dockerfile: Dockerfile.payment-reconciliation-worker
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db-payment-reconciliation-reader-role:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3630
      PAYMENT_RECONCILIATION_DATABASE_URL: postgresql://blujet_payment_reconciliation_reader:${PAYMENT_RECONCILIATION_DATABASE_PASSWORD:-}@db:5432/blujet?schema=public
      PAYMENT_RECONCILIATION_INTERNAL_TOKEN: ${PAYMENT_RECONCILIATION_INTERNAL_TOKEN:-}
      API_REQUEST_TIMEOUT_MS: ${PAYMENT_RECONCILIATION_REQUEST_TIMEOUT_MS:-10000}
      API_MAX_BODY_BYTES: 262144
      TRUST_PROXY_HOPS: '0'
      HTTPS_ENABLED: 'false'
    expose:
      - '3630'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3630/health/ready', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  order-booking:
    profiles: ['order-booking']
    build:
      context: ./backend
      dockerfile: Dockerfile.order-booking-worker
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db-order-booking-reader-role:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3640
      ORDER_BOOKING_DATABASE_URL: postgresql://blujet_order_booking_reader:${ORDER_BOOKING_DATABASE_PASSWORD:-}@db:5432/blujet?schema=public
      ORDER_BOOKING_INTERNAL_TOKEN: ${ORDER_BOOKING_INTERNAL_TOKEN:-}
      API_REQUEST_TIMEOUT_MS: ${ORDER_BOOKING_REQUEST_TIMEOUT_MS:-10000}
      API_MAX_BODY_BYTES: 262144
      TRUST_PROXY_HOPS: '0'
      HTTPS_ENABLED: 'false'
    expose:
      - '3640'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3640/health/ready', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  inventory:
    profiles: ['inventory']
    build:
      context: ./backend
      dockerfile: Dockerfile.inventory-worker
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db-inventory-reader-role:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3650
      INVENTORY_DATABASE_URL: postgresql://blujet_inventory_reader:${INVENTORY_DATABASE_PASSWORD:-}@db:5432/blujet?schema=public
      INVENTORY_INTERNAL_TOKEN: ${INVENTORY_INTERNAL_TOKEN:-}
      API_REQUEST_TIMEOUT_MS: ${INVENTORY_REQUEST_TIMEOUT_MS:-10000}
      API_MAX_BODY_BYTES: 262144
      TRUST_PROXY_HOPS: '0'
      HTTPS_ENABLED: 'false'
    expose:
      - '3650'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3650/health/ready', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ops-admin:
    profiles: ['ops-admin']
    build:
      context: ./backend
      dockerfile: Dockerfile.ops-admin-worker
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db-ops-admin-reader-role:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3660
      OPS_ADMIN_DATABASE_URL: postgresql://blujet_ops_admin_reader:${OPS_ADMIN_DATABASE_PASSWORD:-}@db:5432/blujet?schema=public
      OPS_ADMIN_INTERNAL_TOKEN: ${OPS_ADMIN_INTERNAL_TOKEN:-}
      API_REQUEST_TIMEOUT_MS: ${OPS_ADMIN_REQUEST_TIMEOUT_MS:-10000}
      API_MAX_BODY_BYTES: 262144
      TRUST_PROXY_HOPS: '0'
      HTTPS_ENABLED: 'false'
    expose:
      - '3660'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3660/health/ready', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  identity-service:
    build:
      context: ./identity-service
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    profiles: ['identity']
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3400
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN}
      IDENTITY_JWT_KID: ${IDENTITY_JWT_KID:-blujet-identity-2026}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-https://identity.internal.blujet}
      IDENTITY_JWT_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-blujet-gateway}
      IDENTITY_JWT_PRIVATE_KEY: ${IDENTITY_JWT_PRIVATE_KEY}
      IDENTITY_REDIS_URL: ${IDENTITY_REDIS_URL:-redis://redis:6379}
    expose:
      - '3400'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3400/health/live', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      INTERNAL_TOKEN: ${ML_SERVICE_INTERNAL_TOKEN}
      LOG_LEVEL: info
    # Internal only — reachable exclusively by the backend, never the
    # internet or the frontend (CLAUDE.md ML Service Rules).
    expose:
      - '8000'

  backend:
    image: blujet-backend:${DEPLOY_SHA:-local}
    build:
      context: ./backend
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-runtime-roles:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pss-service:
        condition: service_healthy
      experience-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Owner credentials exist only in the two short-lived database jobs.
      DATABASE_URL: postgresql://blujet_core_runtime:${CORE_DATABASE_PASSWORD}@db:5432/blujet?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      IDENTITY_INTEGRATION_ENABLED: ${IDENTITY_INTEGRATION_ENABLED:-false}
      IDENTITY_JWT_VERIFICATION_MODE: ${IDENTITY_JWT_VERIFICATION_MODE:-legacy}
      IDENTITY_SERVICE_URL: http://identity-service:3400
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN}
      IDENTITY_JWKS_CACHE_TTL_MS: ${IDENTITY_JWKS_CACHE_TTL_MS:-300000}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-https://identity.internal.blujet}
      IDENTITY_JWT_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-blujet-gateway}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_INTERNAL_TOKEN: ${ML_SERVICE_INTERNAL_TOKEN}
      # Production is fail-closed. Kavenegar is configured through the IT
      # panel; a real PSP adapter must replace `disabled` before ticket sales.
      SMS_PROVIDER: kavenegar
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-disabled}
      AUTH_SANDBOX_ENABLED: ${AUTH_SANDBOX_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CORS_ORIGINS: http://${SERVER_IP}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_REQUEST_TIMEOUT_MS: ${API_REQUEST_TIMEOUT_MS:-30000}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-10485760}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      SEARCH_CACHE_GEN: ${SEARCH_CACHE_GEN:-v1}
      NOTIFY_INTEGRATION_ENABLED: 'true'
      NOTIFY_SERVICE_URL: http://notify-service:3200
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN}
      NOTIFY_REQUEST_TIMEOUT_MS: ${NOTIFY_REQUEST_TIMEOUT_MS:-3000}
      NOTIFY_EVENT_TIMEOUT_MS: ${NOTIFY_EVENT_TIMEOUT_MS:-15000}
      NOTIFY_OUTBOX_POLL_MS: ${NOTIFY_OUTBOX_POLL_MS:-1000}
      EXPERIENCE_INTEGRATION_ENABLED: ${EXPERIENCE_INTEGRATION_ENABLED:-true}
      EXPERIENCE_SERVICE_URL: http://experience-service:3300
      EXPERIENCE_INTERNAL_TOKEN: ${EXPERIENCE_INTERNAL_TOKEN}
      EXPERIENCE_REQUEST_TIMEOUT_MS: ${EXPERIENCE_REQUEST_TIMEOUT_MS:-3000}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      # The client is wired now, but authoritative sales remain on the
      # existing booking engine until the later owner-approved cutover slice.
      PSS_INTEGRATION_ENABLED: ${PSS_INTEGRATION_ENABLED:-false}
      PSS_SERVICE_URL: http://pss-service:3100
      PSS_INTERNAL_TOKEN: ${PSS_INTERNAL_TOKEN}
      PSS_REQUEST_TIMEOUT_MS: ${PSS_REQUEST_TIMEOUT_MS:-3000}
      CORE_OFFER_SIGNING_SECRET: ${CORE_OFFER_SIGNING_SECRET:-}
      CORE_OFFER_TTL_SECONDS: ${CORE_OFFER_TTL_SECONDS:-900}
      CORE_OFFER_PUBLIC_ENABLED: ${CORE_OFFER_PUBLIC_ENABLED:-false}
      OFFER_SERVICE_ENABLED: ${OFFER_SERVICE_ENABLED:-false}
      OFFER_SERVICE_URL: http://offer-pricing:3600
      OFFER_INTERNAL_TOKEN: ${OFFER_INTERNAL_TOKEN:-}
      OFFER_REQUEST_TIMEOUT_MS: ${OFFER_REQUEST_TIMEOUT_MS:-3000}
      SEED_ON_START: ${SEED_ON_START:-false}
      FINANCE_HOLO_VERIFY_URL: ${FINANCE_HOLO_VERIFY_URL:-}
      FINANCE_HOLO_SYNC_URL: ${FINANCE_HOLO_SYNC_URL:-}
      FINANCE_SEPIDAR_VERIFY_URL: ${FINANCE_SEPIDAR_VERIFY_URL:-}
      FINANCE_SEPIDAR_SYNC_URL: ${FINANCE_SEPIDAR_SYNC_URL:-}
      FINANCE_HESABFA_VERIFY_URL: ${FINANCE_HESABFA_VERIFY_URL:-}
      FINANCE_HESABFA_SYNC_URL: ${FINANCE_HESABFA_SYNC_URL:-}
      FINANCE_RAHKARAN_VERIFY_URL: ${FINANCE_RAHKARAN_VERIFY_URL:-}
      FINANCE_RAHKARAN_SYNC_URL: ${FINANCE_RAHKARAN_SYNC_URL:-}
      FINANCE_PARMIS_VERIFY_URL: ${FINANCE_PARMIS_VERIFY_URL:-}
      FINANCE_PARMIS_SYNC_URL: ${FINANCE_PARMIS_SYNC_URL:-}
      # Temporary UAT switch. Keep false for real operation. When true, the
      # owner may issue an audited 15-minute preview token for an existing
      # active USER or AGENCY account.
      SANDBOX_SUPER_ADMIN_TENANT_ACCESS: ${SANDBOX_SUPER_ADMIN_TENANT_ACCESS:-false}
      # Frontend and backend share one origin behind the frontend's nginx
      # proxy (port 80) — no TLS yet on a bare IP, so a Secure cookie would
      # be silently dropped by the browser. Flip to "true" once a real
      # domain + HTTPS is in front of this (see docs/DEPLOY_IP.md).
      COOKIE_SECURE: 'false'
    # No published port here — Phase 2 (traffic hardening): the backend is
    # reachable ONLY through the frontend's nginx proxy on :80. Publishing
    # :3000 directly meant anyone could bypass nginx (and its future
    # rate-limiting/WAF layer) and hit the API straight from the internet.
    # For Swagger/health debugging from the host, use
    # `docker compose -f docker-compose.prod.yml exec backend curl localhost:3000/health`
    # or a temporary `docker compose port backend 3000` instead of a
    # permanent published port.
    expose:
      - '3000'
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Empty/relative — the frontend's nginx proxies API routes on the
        # same origin, so it never needs to know the server's IP at build
        # time (see frontend/nginx.conf).
        VITE_API_URL: ''
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SANDBOX_AUTH: ${VITE_SANDBOX_AUTH:-false}
        VITE_GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '80:80'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
  db_wal_archive:
  pss_db_data:
  backend_uploads:
  backend_backups:
