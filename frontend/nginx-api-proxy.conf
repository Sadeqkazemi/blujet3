# Shared by the normal API location and the HTML-aware SPA/API overlap
# location so proxy headers and upstream behaviour cannot drift apart.
include /etc/nginx/snippets/security-headers.conf;
set $backend_upstream http://backend:3000;
proxy_pass $backend_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Request-Id $gateway_request_id;
# Emit exactly one edge-owned correlation header, including Nginx-generated
# upstream failures; the backend receives and logs this same value.
proxy_hide_header X-Request-Id;
add_header X-Request-Id $gateway_request_id always;
proxy_connect_timeout 5s;
proxy_send_timeout 35s;
proxy_read_timeout 35s;
