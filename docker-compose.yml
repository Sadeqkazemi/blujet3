services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blujet
      POSTGRES_PASSWORD: blujet
      POSTGRES_DB: blujet
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blujet']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  pss-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blujet_pss
      POSTGRES_PASSWORD: blujet_pss
      POSTGRES_DB: blujet_pss
    ports:
      - '5433:5432'
    volumes:
      - pss_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blujet_pss -d blujet_pss']
      interval: 5s
      timeout: 5s
      retries: 10

  pss-service:
    build: ./pss-service
    depends_on:
      pss-db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3100
      PSS_DATABASE_URL: postgresql://blujet_pss:blujet_pss@pss-db:5432/blujet_pss?schema=public
      PSS_INTERNAL_TOKEN: local-pss-internal-token-at-least-32-characters
    ports:
      - '3100:3100'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3100/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  experience-service:
    build: ./experience-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3300
      EXPERIENCE_DATABASE_URL: postgresql://blujet:blujet@db:5432/blujet?schema=public
      EXPERIENCE_INTERNAL_TOKEN: local-experience-internal-token-at-least-32-characters
      PII_ENCRYPTION_KEY: 3a6dfd91b775e9cd09be8a576889adfe518a31ad1064af3d63c21ce9aadbdf10
      EXPERIENCE_UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - '3300'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3300/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  identity-service:
    build: ./identity-service
    profiles: ['identity']
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3400
      IDENTITY_INTERNAL_TOKEN: local-identity-internal-token-at-least-32-characters
      IDENTITY_JWT_KID: blujet-identity-dev
      IDENTITY_JWT_ISSUER: https://identity.internal.blujet
      IDENTITY_JWT_AUDIENCE: blujet-gateway
      IDENTITY_JWT_PRIVATE_KEY: ${IDENTITY_JWT_PRIVATE_KEY:-}
      IDENTITY_REDIS_URL: redis://redis:6379
    expose:
      - '3400'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3400/health/live', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
  pss_db_data:
  backend_uploads:
