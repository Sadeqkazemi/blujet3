services:
  notify-db:
    image: postgres:16-alpine
    profiles: ["independent-domain-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: blujet_notify_owner
      POSTGRES_PASSWORD: ${NOTIFY_POSTGRES_PASSWORD:?Supply the Notify database owner password}
      POSTGRES_DB: blujet_notify
    volumes:
      - notify_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blujet_notify_owner -d blujet_notify"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  experience-db:
    image: postgres:16-alpine
    profiles: ["independent-domain-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: blujet_experience_owner
      POSTGRES_PASSWORD: ${EXPERIENCE_POSTGRES_PASSWORD:?Supply the Experience database owner password}
      POSTGRES_DB: blujet_experience
    volumes:
      - experience_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U blujet_experience_owner -d blujet_experience",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  identity-db:
    image: postgres:16-alpine
    profiles: ["independent-domain-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: blujet_identity_owner
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?Supply the Identity database owner password}
      POSTGRES_DB: blujet_identity
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blujet_identity_owner -d blujet_identity"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  loyalty-db:
    image: postgres:16-alpine
    profiles: ["independent-domain-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: blujet_loyalty_owner
      POSTGRES_PASSWORD: ${LOYALTY_POSTGRES_PASSWORD:?Supply the Loyalty database owner password}
      POSTGRES_DB: blujet_loyalty
    volumes:
      - loyalty_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blujet_loyalty_owner -d blujet_loyalty"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  notify-db-migrate:
    profiles: ["independent-domain-db"]
    build:
      context: ./notify-service
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      notify-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NOTIFY_DATABASE_URL: postgresql://blujet_notify_owner:${NOTIFY_POSTGRES_PASSWORD}@notify-db:5432/blujet_notify
    command: ["npm", "run", "migration:run:prod"]

  experience-db-migrate:
    profiles: ["independent-domain-db"]
    build:
      context: ./experience-service
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      experience-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      EXPERIENCE_DATABASE_URL: postgresql://blujet_experience_owner:${EXPERIENCE_POSTGRES_PASSWORD}@experience-db:5432/blujet_experience
    command: ["npm", "run", "migration:run:prod"]

  identity-db-migrate:
    profiles: ["independent-domain-db"]
    build:
      context: ./identity-service
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      IDENTITY_DATABASE_URL: postgresql://blujet_identity_owner:${IDENTITY_POSTGRES_PASSWORD}@identity-db:5432/blujet_identity
    command: ["npm", "run", "migration:run:prod"]

  loyalty-db-migrate:
    profiles: ["independent-domain-db"]
    build:
      context: ./loyalty-service
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      loyalty-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOYALTY_DATABASE_URL: postgresql://blujet_loyalty_owner:${LOYALTY_POSTGRES_PASSWORD}@loyalty-db:5432/blujet_loyalty
    command: ["npm", "run", "migration:run:prod"]

  notify-db-runtime-role:
    profiles: ["independent-domain-db"]
    image: blujet-backend:${DEPLOY_SHA:-local}
    build:
      context: ./backend
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      notify-db-migrate:
        condition: service_completed_successfully
    environment:
      DOMAIN_DATABASE_KIND: notify
      DOMAIN_DATABASE_OWNER_URL: postgresql://blujet_notify_owner:${NOTIFY_POSTGRES_PASSWORD}@notify-db:5432/blujet_notify
      NOTIFY_DATABASE_PASSWORD: ${NOTIFY_DATABASE_PASSWORD:?Supply the Notify runtime password}
    command:
      ["node", "dist/database/provision-independent-domain-runtime-role.js"]

  experience-db-runtime-role:
    profiles: ["independent-domain-db"]
    image: blujet-backend:${DEPLOY_SHA:-local}
    build:
      context: ./backend
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      experience-db-migrate:
        condition: service_completed_successfully
    environment:
      DOMAIN_DATABASE_KIND: experience
      DOMAIN_DATABASE_OWNER_URL: postgresql://blujet_experience_owner:${EXPERIENCE_POSTGRES_PASSWORD}@experience-db:5432/blujet_experience
      EXPERIENCE_DATABASE_PASSWORD: ${EXPERIENCE_DATABASE_PASSWORD:?Supply the Experience runtime password}
    command:
      ["node", "dist/database/provision-independent-domain-runtime-role.js"]

  identity-db-runtime-role:
    profiles: ["independent-domain-db"]
    image: blujet-backend:${DEPLOY_SHA:-local}
    build:
      context: ./backend
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      identity-db-migrate:
        condition: service_completed_successfully
    environment:
      DOMAIN_DATABASE_KIND: identity
      DOMAIN_DATABASE_OWNER_URL: postgresql://blujet_identity_owner:${IDENTITY_POSTGRES_PASSWORD}@identity-db:5432/blujet_identity
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?Supply the Identity runtime password}
    command:
      ["node", "dist/database/provision-independent-domain-runtime-role.js"]

  loyalty-db-runtime-role:
    profiles: ["independent-domain-db"]
    image: blujet-backend:${DEPLOY_SHA:-local}
    build:
      context: ./backend
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      loyalty-db-migrate:
        condition: service_completed_successfully
    environment:
      DOMAIN_DATABASE_KIND: loyalty
      DOMAIN_DATABASE_OWNER_URL: postgresql://blujet_loyalty_owner:${LOYALTY_POSTGRES_PASSWORD}@loyalty-db:5432/blujet_loyalty
      LOYALTY_DATABASE_PASSWORD: ${LOYALTY_DATABASE_PASSWORD:?Supply the Loyalty runtime password}
    command:
      ["node", "dist/database/provision-independent-domain-runtime-role.js"]

  notify-db-transfer:
    profiles: ["independent-domain-transfer"]
    image: blujet-backend:${DEPLOY_SHA:-local}
    build:
      context: ./backend
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      notify-db-migrate:
        condition: service_completed_successfully
    environment:
      DOMAIN_TRANSFER_KIND: notify
      DOMAIN_TRANSFER_SOURCE_DATABASE_URL: ${DOMAIN_TRANSFER_SOURCE_DATABASE_URL:?Supply the read-only Core source URL}
      DOMAIN_TRANSFER_TARGET_DATABASE_URL: postgresql://blujet_notify_owner:${NOTIFY_POSTGRES_PASSWORD}@notify-db:5432/blujet_notify
      DOMAIN_TRANSFER_APPLY: ${DOMAIN_TRANSFER_APPLY:-false}
      DOMAIN_TRANSFER_BACKUP_REFERENCE: ${DOMAIN_TRANSFER_BACKUP_REFERENCE:-}
      DOMAIN_TRANSFER_BATCH_SIZE: ${DOMAIN_TRANSFER_BATCH_SIZE:-100}
    command: ["node", "dist/database/transfer-independent-domain-data.js"]

  experience-db-transfer:
    profiles: ["independent-domain-transfer"]
    image: blujet-backend:${DEPLOY_SHA:-local}
    build:
      context: ./backend
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      experience-db-migrate:
        condition: service_completed_successfully
    environment:
      DOMAIN_TRANSFER_KIND: experience
      DOMAIN_TRANSFER_SOURCE_DATABASE_URL: ${DOMAIN_TRANSFER_SOURCE_DATABASE_URL:?Supply the read-only Core source URL}
      DOMAIN_TRANSFER_TARGET_DATABASE_URL: postgresql://blujet_experience_owner:${EXPERIENCE_POSTGRES_PASSWORD}@experience-db:5432/blujet_experience
      DOMAIN_TRANSFER_APPLY: ${DOMAIN_TRANSFER_APPLY:-false}
      DOMAIN_TRANSFER_BACKUP_REFERENCE: ${DOMAIN_TRANSFER_BACKUP_REFERENCE:-}
      DOMAIN_TRANSFER_BATCH_SIZE: ${DOMAIN_TRANSFER_BATCH_SIZE:-100}
    command: ["node", "dist/database/transfer-independent-domain-data.js"]

  identity-db-transfer:
    profiles: ["independent-domain-transfer"]
    image: blujet-backend:${DEPLOY_SHA:-local}
    build:
      context: ./backend
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      identity-db-migrate:
        condition: service_completed_successfully
    environment:
      DOMAIN_TRANSFER_KIND: identity
      DOMAIN_TRANSFER_SOURCE_DATABASE_URL: ${DOMAIN_TRANSFER_SOURCE_DATABASE_URL:?Supply the read-only Core source URL}
      DOMAIN_TRANSFER_TARGET_DATABASE_URL: postgresql://blujet_identity_owner:${IDENTITY_POSTGRES_PASSWORD}@identity-db:5432/blujet_identity
      DOMAIN_TRANSFER_APPLY: ${DOMAIN_TRANSFER_APPLY:-false}
      DOMAIN_TRANSFER_BACKUP_REFERENCE: ${DOMAIN_TRANSFER_BACKUP_REFERENCE:-}
      DOMAIN_TRANSFER_BATCH_SIZE: ${DOMAIN_TRANSFER_BATCH_SIZE:-100}
    command: ["node", "dist/database/transfer-independent-domain-data.js"]

  loyalty-db-transfer:
    profiles: ["independent-domain-transfer"]
    image: blujet-backend:${DEPLOY_SHA:-local}
    build:
      context: ./backend
      args:
        GIT_COMMIT_SHA: ${DEPLOY_SHA:-unknown}
    restart: "no"
    depends_on:
      loyalty-db-migrate:
        condition: service_completed_successfully
    environment:
      DOMAIN_TRANSFER_KIND: loyalty
      DOMAIN_TRANSFER_SOURCE_DATABASE_URL: ${DOMAIN_TRANSFER_SOURCE_DATABASE_URL:?Supply the read-only Core source URL}
      DOMAIN_TRANSFER_TARGET_DATABASE_URL: postgresql://blujet_loyalty_owner:${LOYALTY_POSTGRES_PASSWORD}@loyalty-db:5432/blujet_loyalty
      DOMAIN_TRANSFER_APPLY: ${DOMAIN_TRANSFER_APPLY:-false}
      DOMAIN_TRANSFER_BACKUP_REFERENCE: ${DOMAIN_TRANSFER_BACKUP_REFERENCE:-}
      DOMAIN_TRANSFER_BATCH_SIZE: ${DOMAIN_TRANSFER_BATCH_SIZE:-100}
    command: ["node", "dist/database/transfer-independent-domain-data.js"]

volumes:
  notify_db_data:
  experience_db_data:
  identity_db_data:
  loyalty_db_data:
