  independent-domain-databases:
    name: Independent domain database cutover
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.notify == 'true' ||
      needs.changes.outputs.experience == 'true' ||
      needs.changes.outputs.identity == 'true' ||
      needs.changes.outputs.loyalty == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            notify-service/package-lock.json
            experience-service/package-lock.json
            identity-service/package-lock.json
            loyalty-service/package-lock.json
      - name: Install database toolchains
        run: |
          npm ci --prefix backend
          npm ci --prefix notify-service
          npm ci --prefix experience-service
          npm ci --prefix identity-service
          npm ci --prefix loyalty-service
      - name: Create isolated source and target databases
        working-directory: backend
        env:
          DATABASE_URL: postgresql://blujet:blujet@localhost:5432/postgres
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const databases = [
            'notify_source_test',
            'notify_target_test',
            'experience_source_test',
            'experience_target_test',
            'identity_source_test',
            'identity_target_test',
            'loyalty_source_test',
            'loyalty_target_test',
          ];
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            for (const database of databases) {
              await client.query(`CREATE DATABASE ${database}`);
            }
            await client.end();
          })().catch(() => process.exit(1));
          NODE
      - name: Apply standalone schemas to both sides
        run: |
          NOTIFY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/notify_source_test npm --prefix notify-service run migration:run
          NOTIFY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/notify_target_test npm --prefix notify-service run migration:run
          EXPERIENCE_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/experience_source_test npm --prefix experience-service run migration:run
          EXPERIENCE_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/experience_target_test npm --prefix experience-service run migration:run
          IDENTITY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/identity_source_test npm --prefix identity-service run migration:run
          IDENTITY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/identity_target_test npm --prefix identity-service run migration:run
          LOYALTY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/loyalty_source_test npm --prefix loyalty-service run migration:run
          LOYALTY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/loyalty_target_test npm --prefix loyalty-service run migration:run
      - name: Prove transfer, reconciliation and privilege isolation
        working-directory: backend
        env:
          NOTIFY_TRANSFER_SOURCE_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/notify_source_test
          NOTIFY_TRANSFER_TARGET_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/notify_target_test
          EXPERIENCE_TRANSFER_SOURCE_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/experience_source_test
          EXPERIENCE_TRANSFER_TARGET_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/experience_target_test
          IDENTITY_TRANSFER_SOURCE_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/identity_source_test
          IDENTITY_TRANSFER_TARGET_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/identity_target_test
          LOYALTY_TRANSFER_SOURCE_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/loyalty_source_test
          LOYALTY_TRANSFER_TARGET_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/loyalty_target_test
        run: npm run test:e2e:independent-domain-db
      - name: Prove target rollback and clean restore
        run: |
          NOTIFY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/notify_target_test npm --prefix notify-service run migration:revert
          EXPERIENCE_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/experience_target_test npm --prefix experience-service run migration:revert
          IDENTITY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/identity_target_test npm --prefix identity-service run migration:revert
          LOYALTY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/loyalty_target_test npm --prefix loyalty-service run migration:revert
          NOTIFY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/notify_target_test npm --prefix notify-service run migration:run
          EXPERIENCE_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/experience_target_test npm --prefix experience-service run migration:run
          IDENTITY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/identity_target_test npm --prefix identity-service run migration:run
          LOYALTY_DATABASE_URL=postgresql://blujet:blujet@localhost:5432/loyalty_target_test npm --prefix loyalty-service run migration:run

  backend-migration-compatibility:
    name: Backend migration compatibility
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.backend_migration == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            baseline/backend/package-lock.json
            candidate/backend/package-lock.json
      - name: Build baseline schema
        working-directory: baseline/backend
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run
      - name: Reject contract-first migration violations
        working-directory: candidate
        run: node scripts/check-expand-only-migrations.mjs ${{ github.event.pull_request.base.sha }}
      - name: Rehearse candidate migration over baseline schema
        working-directory: candidate/backend
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run

