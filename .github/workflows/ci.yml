      - name: Verify event schema compatibility with target commit
        if: github.event_name == 'pull_request'
        env:
          EVENT_SCHEMA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$EVENT_SCHEMA_BASE_SHA"
          git show "${EVENT_SCHEMA_BASE_SHA}:docs/events/schema-registry/core-itinerary-v1.json" \
            > "$RUNNER_TEMP/core-itinerary-v1.base.json"
          npm run events:schema:compat -- \
            "$RUNNER_TEMP/core-itinerary-v1.base.json"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  reporting:
    name: Reporting physical database
    needs: changes
    if: needs.changes.outputs.reporting == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_reporting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_reporting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply standalone Reporting migration
        env:
          REPORTING_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_reporting_test
        run: npm run migration:run:reporting
      - name: Prove isolated schema and metadata parity
        env:
          REPORTING_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_reporting_test
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.REPORTING_DATABASE_URL });
            await client.connect();
            const schemas = await client.query(
              `SELECT schema_name FROM information_schema.schemata
               WHERE schema_name NOT IN ('information_schema', 'public')
                 AND schema_name NOT LIKE 'pg_%'
               ORDER BY schema_name`,
            );
            if (JSON.stringify(schemas.rows) !== JSON.stringify([{ schema_name: 'reporting' }])) process.exit(1);
            const tables = await client.query(
              `SELECT table_name FROM information_schema.tables
               WHERE table_schema = 'reporting' ORDER BY table_name`,
            );
            const expected = [
              'core_itinerary_event_projections',
              'core_itinerary_event_receipts',
              'kafka_consumer_checkpoints',
              'kafka_processing_failures',
            ];
            if (JSON.stringify(tables.rows.map((row) => row.table_name)) !== JSON.stringify(expected)) process.exit(1);
            const foreignKeys = await client.query(
              `SELECT count(*)::int AS count
               FROM information_schema.table_constraints
               WHERE table_schema = 'reporting' AND constraint_type = 'FOREIGN KEY'`,
            );
            if (foreignKeys.rows[0]?.count !== 0) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          schema_log=$(npm run schema:log:reporting 2>&1)
          echo "$schema_log"
          echo "$schema_log" | grep -q 'Your schema is up to date'
      - run: npm run typecheck
      - run: npm run build
      - name: Prove compiled rollback and restore
        env:
          REPORTING_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_reporting_test
        run: |
          set -euo pipefail
          npm run migration:revert:reporting:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.REPORTING_DATABASE_URL });
            await client.connect();
            const schema = await client.query(
              "SELECT count(*)::int AS count FROM information_schema.schemata WHERE schema_name = 'reporting'",
            );
            if (schema.rows[0]?.count !== 0) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          npm run migration:run:reporting:prod
      - name: Build the opt-in Reporting container
        run: docker build -f Dockerfile.reporting-worker -t blujet-reporting:ci .

