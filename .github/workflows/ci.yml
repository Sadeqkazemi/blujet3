            const state = await client.query('SHOW transaction_read_only');
            if (state.rows[0]?.transaction_read_only !== 'on') process.exit(1);
            await client.query('SELECT count(*) FROM orders.core_itinerary_orders');
            const pii = await client.query(
              "SELECT has_column_privilege(current_user, 'orders.core_itinerary_orders', 'contactPhone', 'SELECT') AS allowed",
            );
            if (pii.rows[0]?.allowed !== false) process.exit(1);
            try {
              await client.query('UPDATE orders.core_itinerary_orders SET status = status');
              process.exit(1);
            } catch (error) {
              if (error?.code !== '25006') process.exit(1);
            } finally {
              await client.end();
            }
          })().catch(() => process.exit(1));
          NODE
          node dist/order-booking-worker.main.js >/tmp/blujet-order-booking.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3640/health/ready >/tmp/order-booking-ready.json; then break; fi
            sleep 1
          done
          grep -q '"readOnly":true' /tmp/order-booking-ready.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:3640/internal/v1/order-booking/holds/due)" = '401'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-Internal-Token: order_booking_internal_ci_token_2026_09_09' \
            'http://localhost:3640/internal/v1/order-booking/holds/due?limit=0')" = '400'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'X-Internal-Token: order_booking_internal_ci_token_2026_09_09' \
            --header 'Content-Type: application/json' --data '{}' \
            http://localhost:3640/internal/v1/order-booking/orders/ABC123/cancel)" = '404'
      - name: Build the opt-in Order/Booking container
        run: docker build -f Dockerfile.order-booking-worker -t blujet-order-booking:ci .

