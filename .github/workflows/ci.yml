          cache-dependency-path: ml-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - experience-service
      - loyalty-service
      - agency-service
      - identity-service
      - notify-service
      - backend-migration-compatibility
      - pss-service
      - backend
      - offer-pricing
      - ticketing-refund
      - payment-reconciliation
      - order-booking
      - inventory
      - backend-backup-restore
      - backend-pitr-recovery
      - backend-kafka
      - backend-e2e
      - frontend
      - ml-service
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require every selected job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
