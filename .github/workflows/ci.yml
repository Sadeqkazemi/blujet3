      - name: Prove the restricted reader and Offer HTTP boundary
        env:
          MIGRATION_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_test
          OFFER_DATABASE_PASSWORD: offer_reader_ci_password_2026_09_08
