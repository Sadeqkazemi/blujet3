  ops-admin:
    name: Ops/Admin process
    needs: changes
    if: needs.changes.outputs.ops_admin == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prove standalone Ops/Admin projection database
        env:
          OPS_ADMIN_PROJECTION_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_ops_admin_projection_test
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: 'postgresql://blujet:blujet@localhost:5432/postgres' });
            await client.connect();
            await client.query('CREATE DATABASE blujet_ops_admin_projection_test');
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          npm run migration:run:ops-admin
          schema_log=$(npm run schema:log:ops-admin 2>&1)
          echo "$schema_log"
          echo "$schema_log" | grep -q 'Your schema is up to date'
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.OPS_ADMIN_PROJECTION_DATABASE_URL });
            await client.connect();
            const tables = await client.query(
              `SELECT table_name FROM information_schema.tables
               WHERE table_schema = 'ops' ORDER BY table_name`,
            );
            if (JSON.stringify(tables.rows) !== JSON.stringify([
              { table_name: 'cartable_projection_event_receipts' },
              { table_name: 'cartable_tasks' },
            ])) process.exit(1);
            const columns = await client.query(
              `SELECT column_name FROM information_schema.columns
               WHERE table_schema = 'ops' AND table_name = 'cartable_tasks'
               ORDER BY ordinal_position`,
            );
            const expected = ['id', 'assigneeId', 'category', 'sourceType', 'sourceId', 'status', 'resolvedAt', 'readAt', 'createdAt', 'taskVersion', 'auditId', 'fingerprint'];
            if (JSON.stringify(columns.rows.map((row) => row.column_name)) !== JSON.stringify(expected)) process.exit(1);
            const enums = await client.query(
              `SELECT count(DISTINCT t.oid)::int AS count
               FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
               JOIN pg_enum e ON e.enumtypid = t.oid WHERE n.nspname = 'ops'`,
            );
            if (enums.rows[0]?.count !== 3) process.exit(1);
            const foreignKeys = await client.query(
              `SELECT count(*)::int AS count FROM information_schema.table_constraints
               WHERE table_schema = 'ops' AND constraint_type = 'FOREIGN KEY'`,
            );
            if (foreignKeys.rows[0]?.count !== 0) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          npm run test:e2e:ops-admin-projection
      - run: cp .env.test .env
      - run: npm run migration:run
      - run: npm run build
      - name: Prove compiled Ops/Admin projection rollback and restore
        env:
          OPS_ADMIN_PROJECTION_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_ops_admin_projection_test
        run: |
          set -euo pipefail
          npm run migration:revert:ops-admin:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.OPS_ADMIN_PROJECTION_DATABASE_URL });
            await client.connect();
            const tables = await client.query(
              "SELECT table_name FROM information_schema.tables WHERE table_schema = 'ops' ORDER BY table_name",
            );
            if (JSON.stringify(tables.rows) !== JSON.stringify([{ table_name: 'cartable_tasks' }])) process.exit(1);
            const orderingColumns = await client.query(
              `SELECT count(*)::int AS count FROM information_schema.columns
               WHERE table_schema = 'ops' AND table_name = 'cartable_tasks'
                 AND column_name IN ('taskVersion', 'auditId', 'fingerprint')`,
            );
            if (orderingColumns.rows[0]?.count !== 0) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          npm run migration:revert:ops-admin:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.OPS_ADMIN_PROJECTION_DATABASE_URL });
            await client.connect();
            const schema = await client.query(
              "SELECT count(*)::int AS count FROM information_schema.schemata WHERE schema_name = 'ops'",
            );
            if (schema.rows[0]?.count !== 0) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          npm run migration:run:ops-admin:prod
      - name: Prove the restricted reader and content-free HTTP boundary
        env:
          MIGRATION_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_test
          OPS_ADMIN_DATABASE_PASSWORD: ops_admin_reader_ci_password_2026_09_09
          OPS_ADMIN_DATABASE_URL: postgresql://blujet_ops_admin_reader:ops_admin_reader_ci_password_2026_09_09@localhost:5432/blujet_test
          OPS_ADMIN_INTERNAL_TOKEN: ops_admin_internal_ci_token_2026_09_09
          NODE_ENV: test
          PORT: '3660'
        run: |
          set -euo pipefail
          npm run database:provision-ops-admin-reader:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.OPS_ADMIN_DATABASE_URL });
            await client.connect();
            const state = await client.query('SHOW transaction_read_only');
            if (state.rows[0]?.transaction_read_only !== 'on') process.exit(1);
            await client.query('SELECT "id", "assigneeId", "status" FROM ops.cartable_tasks LIMIT 1');
            const content = await client.query(
              "SELECT has_column_privilege(current_user, 'ops.cartable_tasks', 'description', 'SELECT') AS allowed",
            );
            if (content.rows[0]?.allowed !== false) process.exit(1);
            try {
              await client.query('UPDATE ops.cartable_tasks SET status = status');
              process.exit(1);
            } catch (error) {
              if (error?.code !== '25006') process.exit(1);
            } finally {
              await client.end();
            }
          })().catch(() => process.exit(1));
          NODE
          node dist/ops-admin-worker.main.js >/tmp/blujet-ops-admin.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3660/health/ready >/tmp/ops-admin-ready.json; then break; fi
            sleep 1
          done
          grep -q '"readOnly":true' /tmp/ops-admin-ready.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:3660/internal/v1/ops-admin/cartable/summary)" = '401'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-Internal-Token: ops_admin_internal_ci_token_2026_09_09' \
            'http://localhost:3660/internal/v1/ops-admin/cartable/tasks?limit=0')" = '400'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'X-Internal-Token: ops_admin_internal_ci_token_2026_09_09' \
            --header 'Content-Type: application/json' --data '{}' \
            http://localhost:3660/internal/v1/ops-admin/cartable/tasks/task-1/approve)" = '404'
      - name: Build the opt-in Ops/Admin container
        run: docker build -f Dockerfile.ops-admin-worker -t blujet-ops-admin:ci .

