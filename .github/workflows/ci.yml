name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04-arm
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      offer: ${{ steps.scope.outputs.offer }}
      ticketing_refund: ${{ steps.scope.outputs.ticketing_refund }}
      payment_reconciliation: ${{ steps.scope.outputs.payment_reconciliation }}
      order_booking: ${{ steps.scope.outputs.order_booking }}
      inventory: ${{ steps.scope.outputs.inventory }}
      backend_migration: ${{ steps.scope.outputs.backend_migration }}
      experience: ${{ steps.scope.outputs.experience }}
      loyalty: ${{ steps.scope.outputs.loyalty }}
      agency: ${{ steps.scope.outputs.agency }}
      identity: ${{ steps.scope.outputs.identity }}
      notify: ${{ steps.scope.outputs.notify }}
      pss: ${{ steps.scope.outputs.pss }}
      frontend: ${{ steps.scope.outputs.frontend }}
      ml: ${{ steps.scope.outputs.ml }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Select required jobs
        shell: bash
        run: |
          set -euo pipefail

          areas=(backend offer ticketing_refund payment_reconciliation order_booking inventory backend_migration experience loyalty agency identity notify pss frontend ml)
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            for area in "${areas[@]}"; do
              echo "$area=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files

          matches() {
            grep -Eq "$1" /tmp/changed-files
          }

          run_all=false
          if matches '^(\.github/workflows/ci\.yml|docker-compose[^/]*\.ya?ml|\.env\.production\.example)$'; then
            run_all=true
          fi

          emit() {
            local area="$1"
            local pattern="$2"
            if [[ "$run_all" == "true" ]] || matches "$pattern"; then
              echo "$area=true" >> "$GITHUB_OUTPUT"
            else
              echo "$area=false" >> "$GITHUB_OUTPUT"
            fi
          }

          emit backend '^(backend/|scripts/kafka-ci\.test\.mjs$|scripts/(verify-backup-restore\.sh|verify-pitr-recovery\.sh|archive-wal\.sh|database-entrypoint\.sh|backup-base-pitr\.sh)$)'
          emit offer '^(backend/(Dockerfile\.offer-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|src/(offer-worker|config/offer-worker|database/(data-source\.options|entities/|provision-offer-reader-role)|modules/(offer-pricing|pss/)))|docker-compose\.prod\.yml$|docs/features/offer-pricing-process\.md$)'
          emit ticketing_refund '^(backend/(Dockerfile\.ticketing-refund-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|src/(ticketing-refund-worker|ticketing-refund-worker-health|ticketing-refund-worker\.module|config/ticketing-refund-worker|database/(data-source\.options|entities/|provision-ticketing-refund-reader-role)|modules/(ticketing-refund|pss/)))|docker-compose\.prod\.yml$|docs/features/ticketing-refund-process\.md$)'
          emit payment_reconciliation '^(backend/(Dockerfile\.payment-reconciliation-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|src/(payment-reconciliation-worker|payment-reconciliation-worker-health|payment-reconciliation-worker\.module|config/payment-reconciliation-worker|database/(data-source\.options|entities/|provision-payment-reconciliation-reader-role)|modules/payment-reconciliation))|docker-compose\.prod\.yml$|docs/features/payment-reconciliation-process\.md$)'
          emit order_booking '^(backend/(Dockerfile\.order-booking-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|src/(order-booking-worker|order-booking-worker-health|order-booking-worker\.module|config/order-booking-worker|database/(data-source\.options|entities/|provision-order-booking-reader-role)|modules/order-booking))|docker-compose\.prod\.yml$|docs/features/order-booking-process\.md$)'
          emit inventory '^(backend/(Dockerfile\.inventory-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|src/(inventory-worker|inventory-worker-health|inventory-worker\.module|config/inventory-worker|database/(data-source\.options|entities/|provision-inventory-reader-role)|modules/inventory))|docker-compose\.prod\.yml$|docs/features/inventory-process\.md$)'
          emit backend_migration '^(backend/|scripts/check-expand-only-migrations\.mjs$)'
          emit experience '^(experience-service/|backend/(package(-lock)?\.json$|src/database/))'
          emit loyalty '^(loyalty-service/|backend/(package(-lock)?\.json$|tsconfig[^/]*\.json$|nest-cli\.json$|src/database/|src/common/money\.ts$|src/modules/loyalty-shadow/))'
          emit identity '^identity-service/'
          emit agency '^(agency-service/|backend/(package(-lock)?\.json$|tsconfig[^/]*\.json$|nest-cli\.json$|src/database/|src/config/|src/modules/agency-shadow/|src/modules/agency-portal/))'
          emit notify '^(notify-service/|backend/(package(-lock)?\.json$|src/database/))'
          emit pss '^pss-service/'
          emit frontend '^frontend/'
          emit ml '^ml-service/'

  experience-service:
    name: Experience service
    needs: changes
    if: needs.changes.outputs.experience == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_experience_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_experience_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            experience-service/package-lock.json
      - name: Apply shared-cluster schema migrations
        working-directory: backend
        run: |
          npm ci
          cp .env.test .env
          DATABASE_URL=postgresql://blujet:blujet@localhost:5432/blujet_experience_test npm run migration:run
          DATABASE_URL=postgresql://blujet:blujet@localhost:5432/blujet_experience_test npm run seed
      - name: Validate experience service
        working-directory: experience-service
        env:
          NODE_ENV: test
          PORT: 3301
          EXPERIENCE_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_experience_test
          EXPERIENCE_INTERNAL_TOKEN: test-experience-internal-token-at-least-32-characters
          PII_ENCRYPTION_KEY: 3a6dfd91b775e9cd09be8a576889adfe518a31ad1064af3d63c21ce9aadbdf10
        run: |
          npm ci
          npm run lint:check
          npm run typecheck
          npm run build
          npm test
          npm run test:e2e

  loyalty-service:
    name: Loyalty service
    needs: changes
    if: needs.changes.outputs.loyalty == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_loyalty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_loyalty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            loyalty-service/package-lock.json
      - name: Apply existing schema and test fixtures
        working-directory: backend
        env:
          DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_loyalty_test
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run
          npm run seed
      - name: Build and test backend shadow comparator
        working-directory: backend
        run: |
          npm run build
          npm test -- --runInBand --runTestsByPath src/modules/loyalty-shadow/loyalty-shadow.spec.ts
      - name: Validate read-only Loyalty boundary
        working-directory: loyalty-service
        env:
          NODE_ENV: test
          LOYALTY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_loyalty_test
          LOYALTY_INTERNAL_TOKEN: test-loyalty-internal-token-at-least-32-characters
        run: |
          npm ci
          npm run lint:check
          npm run typecheck
          npm run build
          npm test
          npm run test:e2e

  agency-service:
    name: Agency service
    needs: changes
    if: needs.changes.outputs.agency == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_agency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_agency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            agency-service/package-lock.json
      - name: Apply unchanged shared-cluster schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_agency_test
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run
          npm run build
          npm test -- --runInBand agency-shadow agency-invoice.client agency-profile.client
      - name: Validate isolated Agency reader
        working-directory: agency-service
        env:
          NODE_ENV: test
          AGENCY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_agency_test
          AGENCY_INTERNAL_TOKEN: test-agency-internal-token-at-least-32-characters
        run: |
          npm ci
          npm run lint:check
          npm run typecheck
          npm run build
          npm run openapi:export
          git diff --exit-code -- docs/openapi.json
          npm test
          npm run test:e2e

  identity-service:
    name: Identity service
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: identity-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: identity-service/package-lock.json
      - name: Generate ephemeral CI signing key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/blujet-identity-key.pem
          echo "IDENTITY_JWT_PRIVATE_KEY<<KEY" >> "$GITHUB_ENV"
          cat /tmp/blujet-identity-key.pem >> "$GITHUB_ENV"
          echo "KEY" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  notify-service:
    name: Notify service
    needs: changes
    if: needs.changes.outputs.notify == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_notify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_notify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            notify-service/package-lock.json
      - name: Apply shared-cluster schema migrations
        working-directory: backend
        run: |
          npm ci
          cp .env.test .env
          DATABASE_URL=postgresql://blujet:blujet@localhost:5432/blujet_notify_test npm run migration:run
      - name: Validate notify service
        working-directory: notify-service
        env:
          NODE_ENV: test
          PORT: 3201
          NOTIFY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_notify_test
          NOTIFY_INTERNAL_TOKEN: test-notify-internal-token-at-least-32-characters
          PII_ENCRYPTION_KEY: 3a6dfd91b775e9cd09be8a576889adfe518a31ad1064af3d63c21ce9aadbdf10
        run: |
          npm ci
          npm run lint:check
          npm run typecheck
          npm run build
          npm test
          npm run test:e2e

  backend-migration-compatibility:
    name: Backend migration compatibility
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.backend_migration == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            baseline/backend/package-lock.json
            candidate/backend/package-lock.json
      - name: Build baseline schema
        working-directory: baseline/backend
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run
      - name: Reject contract-first migration violations
        working-directory: candidate
        run: node scripts/check-expand-only-migrations.mjs ${{ github.event.pull_request.base.sha }}
      - name: Rehearse candidate migration over baseline schema
        working-directory: candidate/backend
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run

  pss-service:
    name: Central PSS service
    needs: changes
    if: needs.changes.outputs.pss == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet_pss
          POSTGRES_PASSWORD: blujet_pss
          POSTGRES_DB: blujet_pss_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U blujet_pss -d blujet_pss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: pss-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pss-service/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run migration:run
      - run: sh scripts/verify-backup-restore.sh
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  offer-pricing:
    name: Offer/Pricing process
    needs: changes
    if: needs.changes.outputs.offer == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run migration:run
      - run: npm run build
      - name: Prove the restricted reader and Offer HTTP boundary
        env:
          MIGRATION_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_test
          OFFER_DATABASE_PASSWORD: offer_reader_ci_password_2026_09_08
          OFFER_DATABASE_URL: postgresql://blujet_offer_reader:offer_reader_ci_password_2026_09_08@localhost:5432/blujet_test
          OFFER_INTERNAL_TOKEN: offer_internal_ci_token_2026_09_08
          CORE_OFFER_SIGNING_SECRET: core_offer_ci_signing_secret_2026_09_08
          CORE_OFFER_TTL_SECONDS: '900'
          NODE_ENV: test
          PORT: '3610'
        run: |
          set -euo pipefail
          npm run database:provision-offer-reader:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.OFFER_DATABASE_URL });
            await client.connect();
            const state = await client.query('SHOW transaction_read_only');
            if (state.rows[0]?.transaction_read_only !== 'on') process.exit(1);
            await client.query('SELECT count(*) FROM inventory.fare_rules');
            try {
              await client.query('UPDATE inventory.fare_rules SET "classCode" = "classCode"');
              process.exit(1);
            } catch (error) {
              if (error?.code !== '25006') process.exit(1);
            } finally {
              await client.end();
            }
          })().catch(() => process.exit(1));
          NODE
          node dist/offer-worker.main.js >/tmp/blujet-offer.log 2>&1 &
          offer_pid=$!
          trap 'kill "$offer_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3610/health/ready >/tmp/offer-ready.json; then
              break
            fi
            sleep 1
          done
          grep -q '"readOnly":true' /tmp/offer-ready.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'X-Internal-Token: offer_internal_ci_token_2026_09_08' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            http://localhost:3610/internal/v1/offers/11111111-1111-4111-8111-111111111111/hold)" = '404'
      - name: Build the opt-in Offer container
        run: docker build -f Dockerfile.offer-worker -t blujet-offer-pricing:ci .

  ticketing-refund:
    name: Ticketing/Refund process
    needs: changes
    if: needs.changes.outputs.ticketing_refund == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run migration:run
      - run: npm run build
      - name: Prove the restricted reader and read-only HTTP boundary
        env:
          MIGRATION_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_test
          TICKETING_REFUND_DATABASE_PASSWORD: ticketing_refund_reader_ci_password_2026
          TICKETING_REFUND_DATABASE_URL: postgresql://blujet_ticketing_refund_reader:ticketing_refund_reader_ci_password_2026@localhost:5432/blujet_test
          TICKETING_REFUND_INTERNAL_TOKEN: ticketing_refund_internal_ci_token_2026
          NODE_ENV: test
          PORT: '3620'
        run: |
          set -euo pipefail
          npm run database:provision-ticketing-refund-reader:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.TICKETING_REFUND_DATABASE_URL });
            await client.connect();
            const state = await client.query('SHOW transaction_read_only');
            if (state.rows[0]?.transaction_read_only !== 'on') process.exit(1);
            await client.query('SELECT count(*) FROM orders.core_itinerary_orders');
            try {
              await client.query('UPDATE orders.core_itinerary_orders SET "pnr" = "pnr"');
              process.exit(1);
            } catch (error) {
              if (error?.code !== '25006') process.exit(1);
            } finally {
              await client.end();
            }
          })().catch(() => process.exit(1));
          NODE
          node dist/ticketing-refund-worker.main.js >/tmp/blujet-ticketing-refund.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3620/health/ready >/tmp/ticketing-refund-ready.json; then break; fi
            sleep 1
          done
          grep -q '"readOnly":true' /tmp/ticketing-refund-ready.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:3620/internal/v1/ticketing-refund/orders/11111111-1111-4111-8111-111111111111/status)" = '401'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-Internal-Token: ticketing_refund_internal_ci_token_2026' \
            --header 'Content-Type: application/json' --data '{}' \
            http://localhost:3620/internal/v1/ticketing-refund/orders/11111111-1111-4111-8111-111111111111/refund-quote)" = '400'
      - name: Build the opt-in Ticketing/Refund container
        run: docker build -f Dockerfile.ticketing-refund-worker -t blujet-ticketing-refund:ci .

  payment-reconciliation:
    name: Payment/Reconciliation process
    needs: changes
    if: needs.changes.outputs.payment_reconciliation == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run migration:run
      - run: npm run build
      - name: Prove the restricted reader and read-only HTTP boundary
        env:
          MIGRATION_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_test
          PAYMENT_RECONCILIATION_DATABASE_PASSWORD: payment_reconciliation_reader_ci_password_2026
          PAYMENT_RECONCILIATION_DATABASE_URL: postgresql://blujet_payment_reconciliation_reader:payment_reconciliation_reader_ci_password_2026@localhost:5432/blujet_test
          PAYMENT_RECONCILIATION_INTERNAL_TOKEN: payment_reconciliation_internal_ci_token_2026
          NODE_ENV: test
          PORT: '3630'
        run: |
          set -euo pipefail
          npm run database:provision-payment-reconciliation-reader:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.PAYMENT_RECONCILIATION_DATABASE_URL });
            await client.connect();
            const state = await client.query('SHOW transaction_read_only');
            if (state.rows[0]?.transaction_read_only !== 'on') process.exit(1);
            await client.query('SELECT count(*) FROM payments.payment_reconciliations');
            try {
              await client.query('UPDATE payments.payment_reconciliations SET status = status');
              process.exit(1);
            } catch (error) {
              if (error?.code !== '25006') process.exit(1);
            } finally {
              await client.end();
            }
          })().catch(() => process.exit(1));
          NODE
          node dist/payment-reconciliation-worker.main.js >/tmp/blujet-payment-reconciliation.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3630/health/ready >/tmp/payment-reconciliation-ready.json; then break; fi
            sleep 1
          done
          grep -q '"readOnly":true' /tmp/payment-reconciliation-ready.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:3630/internal/v1/payment-reconciliation/pending)" = '401'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-Internal-Token: payment_reconciliation_internal_ci_token_2026' \
            'http://localhost:3630/internal/v1/payment-reconciliation/pending?limit=0')" = '400'
      - name: Build the opt-in Payment/Reconciliation container
        run: docker build -f Dockerfile.payment-reconciliation-worker -t blujet-payment-reconciliation:ci .

