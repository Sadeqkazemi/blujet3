name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04-arm
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      offer: ${{ steps.scope.outputs.offer }}
      ticketing_refund: ${{ steps.scope.outputs.ticketing_refund }}
      payment_reconciliation: ${{ steps.scope.outputs.payment_reconciliation }}
      order_booking: ${{ steps.scope.outputs.order_booking }}
      inventory: ${{ steps.scope.outputs.inventory }}
      ops_admin: ${{ steps.scope.outputs.ops_admin }}
      backend_migration: ${{ steps.scope.outputs.backend_migration }}
      experience: ${{ steps.scope.outputs.experience }}
      loyalty: ${{ steps.scope.outputs.loyalty }}
      agency: ${{ steps.scope.outputs.agency }}
      identity: ${{ steps.scope.outputs.identity }}
      notify: ${{ steps.scope.outputs.notify }}
      reporting: ${{ steps.scope.outputs.reporting }}
      pss: ${{ steps.scope.outputs.pss }}
      frontend: ${{ steps.scope.outputs.frontend }}
      ml: ${{ steps.scope.outputs.ml }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Select required jobs
        shell: bash
        run: |
          set -euo pipefail

          areas=(backend offer ticketing_refund payment_reconciliation order_booking inventory ops_admin backend_migration experience loyalty agency identity notify reporting pss frontend ml)
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            for area in "${areas[@]}"; do
              echo "$area=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files

          matches() {
            grep -Eq "$1" /tmp/changed-files
          }

          run_all=false
          if matches '^(\.github/workflows/ci\.yml|docker-compose[^/]*\.ya?ml|\.env\.production\.example)$'; then
            run_all=true
          fi

          emit() {
            local area="$1"
            local pattern="$2"
            if [[ "$run_all" == "true" ]] || matches "$pattern"; then
              echo "$area=true" >> "$GITHUB_OUTPUT"
            else
              echo "$area=false" >> "$GITHUB_OUTPUT"
            fi
          }

          emit backend '^(backend/|scripts/kafka-ci\.test\.mjs$|scripts/(verify-backup-restore\.sh|verify-pitr-recovery\.sh|archive-wal\.sh|database-entrypoint\.sh|backup-base-pitr\.sh|backup-independent-domain-db\.sh)$)'
          emit offer '^(backend/(Dockerfile\.offer-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|src/(offer-worker|config/offer-worker|database/(data-source\.options|entities/|provision-offer-reader-role)|modules/(offer-pricing|pss/)))|docker-compose\.prod\.yml$|docs/features/offer-pricing-process\.md$)'
          emit ticketing_refund '^(backend/(Dockerfile\.ticketing-refund-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|src/(ticketing-refund-worker|ticketing-refund-worker-health|ticketing-refund-worker\.module|config/ticketing-refund-worker|database/(data-source\.options|entities/|provision-ticketing-refund-reader-role)|modules/(ticketing-refund|pss/)))|docker-compose\.prod\.yml$|docs/features/ticketing-refund-process\.md$)'
          emit payment_reconciliation '^(backend/(Dockerfile\.payment-reconciliation-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|src/(payment-reconciliation-worker|payment-reconciliation-worker-health|payment-reconciliation-worker\.module|config/payment-reconciliation-worker|database/(data-source\.options|entities/|provision-payment-reconciliation-reader-role)|modules/payment-reconciliation))|docker-compose\.prod\.yml$|docs/features/payment-reconciliation-process\.md$)'
          emit order_booking '^(backend/(Dockerfile\.order-booking-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|src/(order-booking-worker|order-booking-worker-health|order-booking-worker\.module|config/order-booking-worker|database/(data-source\.options|entities/|provision-order-booking-reader-role)|modules/order-booking))|docker-compose\.prod\.yml$|docs/features/order-booking-process\.md$)'
          emit inventory '^(backend/(Dockerfile\.inventory-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|src/(inventory-worker|inventory-worker-health|inventory-worker\.module|config/inventory-worker|database/(data-source\.options|entities/|provision-inventory-reader-role)|modules/inventory))|docker-compose\.prod\.yml$|docs/features/inventory-process\.md$)'
          emit ops_admin '^(backend/(Dockerfile\.ops-admin-worker|package(-lock)?\.json|tsconfig[^/]*\.json|nest-cli\.json|test/(jest-ops-admin-projection\.json|ops-admin-projection-consumer\.e2e-spec\.ts)|src/(ops-admin-worker|ops-admin-worker-health|ops-admin-worker\.module|config/ops-admin-worker|database/(data-source\.options|entities/|create-ops-admin-|ops-admin-|provision-ops-admin-reader-role|report-ops-admin-)|modules/ops-admin))|docker-compose\.prod\.yml$|docs/features/(ops-admin-process|microservices-phase-6-ops-admin-projection-(db|consumer))\.md$)'
          emit backend_migration '^(backend/|scripts/check-expand-only-migrations\.mjs$)'
          emit experience '^(experience-service/|backend/(package(-lock)?\.json$|src/database/))'
          emit loyalty '^(loyalty-service/|backend/(package(-lock)?\.json$|tsconfig[^/]*\.json$|nest-cli\.json$|src/database/|src/common/money\.ts$|src/modules/loyalty-shadow/))'
          emit identity '^identity-service/'
          emit agency '^(agency-service/|backend/(package(-lock)?\.json$|tsconfig[^/]*\.json$|nest-cli\.json$|src/database/|src/config/|src/modules/agency-shadow/|src/modules/agency-portal/))'
          emit notify '^(notify-service/|backend/(package(-lock)?\.json$|src/database/))'
          emit reporting '^(backend/(Dockerfile\.reporting-worker|package(-lock)?\.json$|tsconfig[^/]*\.json$|nest-cli\.json$|src/(reporting-worker|config/reporting-worker|database/(reporting-data-source|reporting-migrations/|entities/reporting-|migrations/179(1734400000|2156800000|2329600000)-Reporting)|modules/reporting/))|docker-compose\.prod\.yml$|docs/features/(reporting-|microservices-phase-6-reporting-physical-db\.md$))'
          emit pss '^pss-service/'
          emit frontend '^frontend/'
          emit ml '^ml-service/'

  experience-service:
    name: Experience service
    needs: changes
    if: needs.changes.outputs.experience == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_experience_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_experience_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experience-service/package-lock.json
      - name: Install experience service
        working-directory: experience-service
        run: npm ci
      - name: Apply standalone Experience migrations
        working-directory: experience-service
        env:
          EXPERIENCE_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_experience_test
        run: npm run migration:run
      - name: Validate experience service
        working-directory: experience-service
        env:
          NODE_ENV: test
          PORT: 3301
          EXPERIENCE_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_experience_test
          EXPERIENCE_INTERNAL_TOKEN: test-experience-internal-token-at-least-32-characters
          PII_ENCRYPTION_KEY: 3a6dfd91b775e9cd09be8a576889adfe518a31ad1064af3d63c21ce9aadbdf10
        run: |
          npm run lint:check
          npm run typecheck
          npm run build
          npm test
          npm run test:e2e

  loyalty-service:
    name: Loyalty service
    needs: changes
    if: needs.changes.outputs.loyalty == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_loyalty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_loyalty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            loyalty-service/package-lock.json
      - name: Apply existing schema and test fixtures
        working-directory: backend
        env:
          DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_loyalty_test
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run
          npm run seed
      - name: Build and test backend shadow comparator
        working-directory: backend
        run: |
          npm run build
          npm test -- --runInBand --runTestsByPath src/modules/loyalty-shadow/loyalty-shadow.spec.ts
      - name: Install Loyalty service
        working-directory: loyalty-service
        run: npm ci
      - name: Prove standalone Loyalty database bootstrap
        working-directory: loyalty-service
        env:
          LOYALTY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_loyalty_bootstrap_test
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: 'postgresql://blujet:blujet@localhost:5432/postgres' });
            await client.connect();
            await client.query('CREATE DATABASE blujet_loyalty_bootstrap_test');
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          npm run migration:run
          schema_log=$(npm run schema:log 2>&1)
          echo "$schema_log"
          echo "$schema_log" | grep -q 'Your schema is up to date'
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.LOYALTY_DATABASE_URL });
            await client.connect();
            const tables = await client.query(
              `SELECT table_name FROM information_schema.tables
               WHERE table_schema = 'loyalty' ORDER BY table_name`,
            );
            const expected = [
              'club_card_requests',
              'club_members',
              'club_points_entries',
              'club_tier_rules',
              'customer_referrals',
              'price_locks',
            ];
            if (JSON.stringify(tables.rows.map((row) => row.table_name)) !== JSON.stringify(expected)) process.exit(1);
            const enums = await client.query(
              `SELECT count(DISTINCT t.oid)::int AS count
               FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
               JOIN pg_enum e ON e.enumtypid = t.oid WHERE n.nspname = 'loyalty'`,
            );
            if (enums.rows[0]?.count !== 8) process.exit(1);
            const foreignKeys = await client.query(
              `SELECT count(*)::int AS count,
                      bool_and(confrelid::regclass::text = 'loyalty.club_members') AS internal
               FROM pg_constraint WHERE contype = 'f'
                 AND connamespace = 'loyalty'::regnamespace`,
            );
            if (foreignKeys.rows[0]?.count !== 2 || foreignKeys.rows[0]?.internal !== true) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
      - name: Validate read-only Loyalty boundary
        working-directory: loyalty-service
        env:
          NODE_ENV: test
          LOYALTY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_loyalty_test
          LOYALTY_INTERNAL_TOKEN: test-loyalty-internal-token-at-least-32-characters
        run: |
          npm run lint:check
          npm run typecheck
          npm run build
          npm test
          npm run test:e2e
      - name: Prove compiled Loyalty rollback and restore
        working-directory: loyalty-service
        env:
          LOYALTY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_loyalty_bootstrap_test
        run: |
          set -euo pipefail
          npm run migration:revert:prod
          npm run migration:revert:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.LOYALTY_DATABASE_URL });
            await client.connect();
            const schema = await client.query(
              "SELECT count(*)::int AS count FROM information_schema.schemata WHERE schema_name = 'loyalty'",
            );
            if (schema.rows[0]?.count !== 0) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          npm run migration:run:prod

  agency-service:
    name: Agency service
    needs: changes
    if: needs.changes.outputs.agency == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_agency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_agency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            agency-service/package-lock.json
      - name: Apply unchanged shared-cluster schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_agency_test
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run
          npm run build
          npm test -- --runInBand agency-shadow agency-invoice.client agency-profile.client
      - name: Install Agency service
        working-directory: agency-service
        run: npm ci
      - name: Prove standalone Agency projection database
        working-directory: agency-service
        env:
          AGENCY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_agency_projection_test
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: 'postgresql://blujet:blujet@localhost:5432/postgres' });
            await client.connect();
            await client.query('CREATE DATABASE blujet_agency_projection_test');
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          npm run migration:run
          schema_log=$(npm run schema:log 2>&1)
          echo "$schema_log"
          echo "$schema_log" | grep -q 'Your schema is up to date'
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.AGENCY_DATABASE_URL });
            await client.connect();
            const tables = await client.query(
              `SELECT table_name FROM information_schema.tables
               WHERE table_schema = 'agency' ORDER BY table_name`,
            );
            const expected = ['agency_credit_requests', 'agency_invoices', 'agency_profiles'];
            if (JSON.stringify(tables.rows.map((row) => row.table_name)) !== JSON.stringify(expected)) process.exit(1);
            const enums = await client.query(
              `SELECT count(DISTINCT t.oid)::int AS count
               FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
               JOIN pg_enum e ON e.enumtypid = t.oid WHERE n.nspname = 'agency'`,
            );
            if (enums.rows[0]?.count !== 3) process.exit(1);
            const foreignKeys = await client.query(
              `SELECT count(*)::int AS count,
                      bool_and(confrelid::regclass::text = 'agency.agency_profiles') AS internal
               FROM pg_constraint WHERE contype = 'f'
                 AND connamespace = 'agency'::regnamespace`,
            );
            if (foreignKeys.rows[0]?.count !== 2 || foreignKeys.rows[0]?.internal !== true) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
      - name: Validate isolated Agency reader
        working-directory: agency-service
        env:
          NODE_ENV: test
          AGENCY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_agency_test
          AGENCY_INTERNAL_TOKEN: test-agency-internal-token-at-least-32-characters
        run: |
          npm run lint:check
          npm run typecheck
          npm run build
          npm run openapi:export
          git diff --exit-code -- docs/openapi.json
          npm test
          npm run test:e2e
      - name: Prove compiled Agency projection rollback and restore
        working-directory: agency-service
        env:
          AGENCY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_agency_projection_test
        run: |
          set -euo pipefail
          npm run migration:revert:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.AGENCY_DATABASE_URL });
            await client.connect();
            const schema = await client.query(
              "SELECT count(*)::int AS count FROM information_schema.schemata WHERE schema_name = 'agency'",
            );
            if (schema.rows[0]?.count !== 0) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          npm run migration:run:prod

  identity-service:
    name: Identity service
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: identity-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: identity-service/package-lock.json
      - name: Generate ephemeral CI signing key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/blujet-identity-key.pem
          echo "IDENTITY_JWT_PRIVATE_KEY<<KEY" >> "$GITHUB_ENV"
          cat /tmp/blujet-identity-key.pem >> "$GITHUB_ENV"
          echo "KEY" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Prove standalone Identity database
        env:
          IDENTITY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_identity_test
        run: |
          set -euo pipefail
          npm run migration:run
          schema_log=$(npm run schema:log 2>&1)
          echo "$schema_log"
          echo "$schema_log" | grep -q 'Your schema is up to date'
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.IDENTITY_DATABASE_URL });
            await client.connect();
            const tables = await client.query(
              `SELECT table_name FROM information_schema.tables
               WHERE table_schema = 'identity' ORDER BY table_name`,
            );
            const expected = [
              'customer_identity_verifications',
              'password_reset_events',
              'refresh_tokens',
              'security_policy',
              'two_factor_challenges',
              'users',
            ];
            if (JSON.stringify(tables.rows.map((row) => row.table_name)) !== JSON.stringify(expected)) process.exit(1);
            const enums = await client.query(
              `SELECT count(DISTINCT t.oid)::int AS count
               FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
               JOIN pg_enum e ON e.enumtypid = t.oid WHERE n.nspname = 'identity'`,
            );
            if (enums.rows[0]?.count !== 6) process.exit(1);
            const foreignKeys = await client.query(
              `SELECT count(*)::int AS count,
                      bool_and(confrelid::regclass::text = 'identity.users') AS internal
               FROM pg_constraint WHERE contype = 'f'
                 AND connamespace = 'identity'::regnamespace`,
            );
            if (foreignKeys.rows[0]?.count !== 7 || foreignKeys.rows[0]?.internal !== true) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Prove compiled Identity rollback and restore
        env:
          IDENTITY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_identity_test
        run: |
          set -euo pipefail
          npm run migration:revert:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.IDENTITY_DATABASE_URL });
            await client.connect();
            const schema = await client.query(
              "SELECT count(*)::int AS count FROM information_schema.schemata WHERE schema_name = 'identity'",
            );
            if (schema.rows[0]?.count !== 0) process.exit(1);
            await client.end();
          })().catch(() => process.exit(1));
          NODE
          npm run migration:run:prod

