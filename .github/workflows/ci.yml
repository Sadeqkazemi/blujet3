  backend-pitr-recovery:
    name: Backend PITR recovery proof
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Verify WAL archive and point-in-time recovery
        run: sh scripts/verify-pitr-recovery.sh

  backend-kafka:
    name: Backend real Kafka
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    # The content-addressed official image avoids the slow Apache archive while
    # still providing the exact Kafka distribution used by the fixture.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: backend
      - name: Verify Kafka CI contract
        run: node scripts/kafka-ci.test.mjs
      - name: Prepare verified Kafka
        shell: bash
        run: |
          set -euo pipefail
          kafka_dir=$(mktemp -d "$RUNNER_TEMP/kafka-tools.XXXXXX")
          kafka_image='apache/kafka@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed'
          docker pull "$kafka_image"
          container_id=$(docker create "$kafka_image")
          trap 'docker rm -f "$container_id" >/dev/null 2>&1' EXIT
          docker cp "$container_id:/opt/kafka/." "$kafka_dir"
          docker rm "$container_id"
          trap - EXIT
          test -x "$kafka_dir/bin/kafka-server-start.sh"
          test -f "$kafka_dir/libs/kafka_2.13-3.9.1.jar"
          echo "KAFKA_TEST_HOME=$kafka_dir" >> "$GITHUB_ENV"
          echo "KAFKA_TEST_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - name: Test real Kafka commit, rollback and crash recovery
        working-directory: backend
        run: npm run test:kafka
      - name: Show fixture broker diagnostics
        if: failure()
        shell: bash
        run: find "${TMPDIR:-/tmp}" -maxdepth 2 -path '*/blujet-kafka-*/broker.log' -type f -exec tail -n 100 {} \; 2>/dev/null || true

  backend-e2e:
    name: Backend E2E (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run test:e2e -- --shard=${{ matrix.shard }} --forceExit

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  ml-service:
    name: ML service
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - experience-service
      - loyalty-service
      - agency-service
      - identity-service
      - notify-service
      - backend-migration-compatibility
      - pss-service
      - backend
      - reporting
      - offer-pricing
      - ticketing-refund
      - payment-reconciliation
      - order-booking
      - inventory
      - backend-backup-restore
      - backend-pitr-recovery
      - backend-kafka
      - backend-e2e
      - frontend
      - ml-service
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require every selected job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
