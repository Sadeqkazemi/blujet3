name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experience-service:
    name: Experience service
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_experience_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_experience_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            experience-service/package-lock.json
      - name: Apply shared-cluster schema migrations
        working-directory: backend
        run: |
          npm ci
          cp .env.test .env
          DATABASE_URL=postgresql://blujet:blujet@localhost:5432/blujet_experience_test npm run migration:run
          DATABASE_URL=postgresql://blujet:blujet@localhost:5432/blujet_experience_test npm run seed
      - name: Validate experience service
        working-directory: experience-service
        env:
          NODE_ENV: test
          PORT: 3301
          EXPERIENCE_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_experience_test
          EXPERIENCE_INTERNAL_TOKEN: test-experience-internal-token-at-least-32-characters
          PII_ENCRYPTION_KEY: 3a6dfd91b775e9cd09be8a576889adfe518a31ad1064af3d63c21ce9aadbdf10
        run: |
          npm ci
          npm run lint:check
          npm run typecheck
          npm run build
          npm test
          npm run test:e2e

  identity-service:
    name: Identity service
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: identity-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: identity-service/package-lock.json
      - name: Generate ephemeral CI signing key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/blujet-identity-key.pem
          echo "IDENTITY_JWT_PRIVATE_KEY<<KEY" >> "$GITHUB_ENV"
          cat /tmp/blujet-identity-key.pem >> "$GITHUB_ENV"
          echo "KEY" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  notify-service:
    name: Notify service
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_notify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_notify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            notify-service/package-lock.json
      - name: Apply shared-cluster schema migrations
        working-directory: backend
        run: |
          npm ci
          cp .env.test .env
          DATABASE_URL=postgresql://blujet:blujet@localhost:5432/blujet_notify_test npm run migration:run
      - name: Validate notify service
        working-directory: notify-service
        env:
          NODE_ENV: test
          PORT: 3201
          NOTIFY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_notify_test
          NOTIFY_INTERNAL_TOKEN: test-notify-internal-token-at-least-32-characters
          PII_ENCRYPTION_KEY: 3a6dfd91b775e9cd09be8a576889adfe518a31ad1064af3d63c21ce9aadbdf10
        run: |
          npm ci
          npm run lint:check
          npm run typecheck
          npm run build
          npm test
          npm run test:e2e

  backend-migration-compatibility:
    name: Backend migration compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            baseline/backend/package-lock.json
            candidate/backend/package-lock.json
      - name: Build baseline schema
        working-directory: baseline/backend
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run
      - name: Reject contract-first migration violations
        working-directory: candidate
        run: node scripts/check-expand-only-migrations.mjs ${{ github.event.pull_request.base.sha }}
      - name: Rehearse candidate migration over baseline schema
        working-directory: candidate/backend
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run

  pss-service:
    name: Central PSS service
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet_pss
          POSTGRES_PASSWORD: blujet_pss
          POSTGRES_DB: blujet_pss_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U blujet_pss -d blujet_pss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: pss-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pss-service/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run migration:run
      - run: sh scripts/verify-backup-restore.sh
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  backend:
    name: Backend
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run migration:run
      - run: npm run seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  ml-service:
    name: ML service
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest
