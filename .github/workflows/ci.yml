          OFFER_INTERNAL_TOKEN: offer_internal_ci_token_2026_09_08
          CORE_OFFER_SIGNING_SECRET: core_offer_ci_signing_secret_2026_09_08
          CORE_OFFER_TTL_SECONDS: '900'
          NODE_ENV: test
          PORT: '3610'
        run: |
          set -euo pipefail
          npm run database:provision-offer-reader:prod
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.OFFER_DATABASE_URL });
            await client.connect();
            const state = await client.query('SHOW transaction_read_only');
            if (state.rows[0]?.transaction_read_only !== 'on') process.exit(1);
            await client.query('SELECT count(*) FROM inventory.fare_rules');
            try {
              await client.query('UPDATE inventory.fare_rules SET "classCode" = "classCode"');
              process.exit(1);
            } catch (error) {
              if (error?.code !== '25006') process.exit(1);
            } finally {
              await client.end();
            }
          })().catch(() => process.exit(1));
          NODE
          node dist/offer-worker.main.js >/tmp/blujet-offer.log 2>&1 &
          offer_pid=$!
          trap 'kill "$offer_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3610/health/ready >/tmp/offer-ready.json; then
              break
            fi
            sleep 1
          done
          grep -q '"readOnly":true' /tmp/offer-ready.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'X-Internal-Token: offer_internal_ci_token_2026_09_08' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            http://localhost:3610/internal/v1/offers/11111111-1111-4111-8111-111111111111/hold)" = '404'
      - name: Build the opt-in Offer container
        run: docker build -f Dockerfile.offer-worker -t blujet-offer-pricing:ci .

