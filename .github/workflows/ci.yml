name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04-arm
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      backend_migration: ${{ steps.scope.outputs.backend_migration }}
      experience: ${{ steps.scope.outputs.experience }}
      loyalty: ${{ steps.scope.outputs.loyalty }}
      agency: ${{ steps.scope.outputs.agency }}
      identity: ${{ steps.scope.outputs.identity }}
      notify: ${{ steps.scope.outputs.notify }}
      pss: ${{ steps.scope.outputs.pss }}
      frontend: ${{ steps.scope.outputs.frontend }}
      ml: ${{ steps.scope.outputs.ml }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Select required jobs
        shell: bash
        run: |
          set -euo pipefail

          areas=(backend backend_migration experience loyalty agency identity notify pss frontend ml)
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            for area in "${areas[@]}"; do
              echo "$area=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files

          matches() {
            grep -Eq "$1" /tmp/changed-files
          }

          run_all=false
          if matches '^(\.github/workflows/ci\.yml|docker-compose[^/]*\.ya?ml|\.env\.production\.example)$'; then
            run_all=true
          fi

          emit() {
            local area="$1"
            local pattern="$2"
            if [[ "$run_all" == "true" ]] || matches "$pattern"; then
              echo "$area=true" >> "$GITHUB_OUTPUT"
            else
              echo "$area=false" >> "$GITHUB_OUTPUT"
            fi
          }

          emit backend '^(backend/|scripts/kafka-ci\.test\.mjs$)'
          emit backend_migration '^(backend/|scripts/check-expand-only-migrations\.mjs$)'
          emit experience '^(experience-service/|backend/(package(-lock)?\.json$|src/database/))'
          emit loyalty '^(loyalty-service/|backend/(package(-lock)?\.json$|tsconfig[^/]*\.json$|nest-cli\.json$|src/database/|src/common/money\.ts$|src/modules/loyalty-shadow/))'
          emit identity '^identity-service/'
          emit agency '^(agency-service/|backend/(package(-lock)?\.json$|tsconfig[^/]*\.json$|nest-cli\.json$|src/database/|src/config/|src/modules/agency-shadow/|src/modules/agency-portal/))'
          emit notify '^(notify-service/|backend/(package(-lock)?\.json$|src/database/))'
          emit pss '^pss-service/'
          emit frontend '^frontend/'
          emit ml '^ml-service/'

  experience-service:
    name: Experience service
    needs: changes
    if: needs.changes.outputs.experience == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_experience_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_experience_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            experience-service/package-lock.json
      - name: Apply shared-cluster schema migrations
        working-directory: backend
        run: |
          npm ci
          cp .env.test .env
          DATABASE_URL=postgresql://blujet:blujet@localhost:5432/blujet_experience_test npm run migration:run
          DATABASE_URL=postgresql://blujet:blujet@localhost:5432/blujet_experience_test npm run seed
      - name: Validate experience service
        working-directory: experience-service
        env:
          NODE_ENV: test
          PORT: 3301
          EXPERIENCE_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_experience_test
          EXPERIENCE_INTERNAL_TOKEN: test-experience-internal-token-at-least-32-characters
          PII_ENCRYPTION_KEY: 3a6dfd91b775e9cd09be8a576889adfe518a31ad1064af3d63c21ce9aadbdf10
        run: |
          npm ci
          npm run lint:check
          npm run typecheck
          npm run build
          npm test
          npm run test:e2e

  loyalty-service:
    name: Loyalty service
    needs: changes
    if: needs.changes.outputs.loyalty == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_loyalty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_loyalty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            loyalty-service/package-lock.json
      - name: Apply existing schema and test fixtures
        working-directory: backend
        env:
          DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_loyalty_test
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run
          npm run seed
      - name: Build and test backend shadow comparator
        working-directory: backend
        run: |
          npm run build
          npm test -- --runInBand --runTestsByPath src/modules/loyalty-shadow/loyalty-shadow.spec.ts
      - name: Validate read-only Loyalty boundary
        working-directory: loyalty-service
        env:
          NODE_ENV: test
          LOYALTY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_loyalty_test
          LOYALTY_INTERNAL_TOKEN: test-loyalty-internal-token-at-least-32-characters
        run: |
          npm ci
          npm run lint:check
          npm run typecheck
          npm run build
          npm test
          npm run test:e2e

  agency-service:
    name: Agency service
    needs: changes
    if: needs.changes.outputs.agency == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_agency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_agency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            agency-service/package-lock.json
      - name: Apply unchanged shared-cluster schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_agency_test
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run
          npm run build
          npm test -- --runInBand agency-shadow agency-invoice.client agency-profile.client
      - name: Validate isolated Agency reader
        working-directory: agency-service
        env:
          NODE_ENV: test
          AGENCY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_agency_test
          AGENCY_INTERNAL_TOKEN: test-agency-internal-token-at-least-32-characters
        run: |
          npm ci
          npm run lint:check
          npm run typecheck
          npm run build
          npm run openapi:export
          git diff --exit-code -- docs/openapi.json
          npm test
          npm run test:e2e

  identity-service:
    name: Identity service
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: identity-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: identity-service/package-lock.json
      - name: Generate ephemeral CI signing key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/blujet-identity-key.pem
          echo "IDENTITY_JWT_PRIVATE_KEY<<KEY" >> "$GITHUB_ENV"
          cat /tmp/blujet-identity-key.pem >> "$GITHUB_ENV"
          echo "KEY" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  notify-service:
    name: Notify service
    needs: changes
    if: needs.changes.outputs.notify == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_notify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_notify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            notify-service/package-lock.json
      - name: Apply shared-cluster schema migrations
        working-directory: backend
        run: |
          npm ci
          cp .env.test .env
          DATABASE_URL=postgresql://blujet:blujet@localhost:5432/blujet_notify_test npm run migration:run
      - name: Validate notify service
        working-directory: notify-service
        env:
          NODE_ENV: test
          PORT: 3201
          NOTIFY_DATABASE_URL: postgresql://blujet:blujet@localhost:5432/blujet_notify_test
          NOTIFY_INTERNAL_TOKEN: test-notify-internal-token-at-least-32-characters
          PII_ENCRYPTION_KEY: 3a6dfd91b775e9cd09be8a576889adfe518a31ad1064af3d63c21ce9aadbdf10
        run: |
          npm ci
          npm run lint:check
          npm run typecheck
          npm run build
          npm test
          npm run test:e2e

  backend-migration-compatibility:
    name: Backend migration compatibility
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.backend_migration == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            baseline/backend/package-lock.json
            candidate/backend/package-lock.json
      - name: Build baseline schema
        working-directory: baseline/backend
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run
      - name: Reject contract-first migration violations
        working-directory: candidate
        run: node scripts/check-expand-only-migrations.mjs ${{ github.event.pull_request.base.sha }}
      - name: Rehearse candidate migration over baseline schema
        working-directory: candidate/backend
        run: |
          npm ci
          cp .env.test .env
          npm run migration:run

  pss-service:
    name: Central PSS service
    needs: changes
    if: needs.changes.outputs.pss == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet_pss
          POSTGRES_PASSWORD: blujet_pss
          POSTGRES_DB: blujet_pss_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U blujet_pss -d blujet_pss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: pss-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pss-service/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run migration:run
      - run: sh scripts/verify-backup-restore.sh
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  backend-kafka:
    name: Backend real Kafka
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: backend
      - name: Verify Kafka CI contract
        run: node scripts/kafka-ci.test.mjs
      - name: Prepare verified Kafka
        shell: bash
        run: |
          set -euo pipefail
          kafka_dir=$(mktemp -d "$RUNNER_TEMP/kafka-tools.XXXXXX")
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 180 --retry 2 \
            https://archive.apache.org/dist/kafka/3.9.1/kafka_2.13-3.9.1.tgz \
            --output "$kafka_dir/kafka.tgz"
          printf '%s  %s\n' \
            '1ea204ba73411737a275429ca976d440f007ff0957b90b19be41dc5a4bae52617267769be9f0b5791714d0b3c4c760605bd426faea39edd90763585523fa2cfe' \
            "$kafka_dir/kafka.tgz" | sha512sum --check --strict
          tar -xzf "$kafka_dir/kafka.tgz" -C "$kafka_dir"
          echo "KAFKA_TEST_HOME=$kafka_dir/kafka_2.13-3.9.1" >> "$GITHUB_ENV"
          echo "KAFKA_TEST_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - name: Test real Kafka commit, rollback and crash recovery
        working-directory: backend
        run: npm run test:kafka
      - name: Show fixture broker diagnostics
        if: failure()
        shell: bash
        run: find "${TMPDIR:-/tmp}" -maxdepth 2 -path '*/blujet-kafka-*/broker.log' -type f -exec tail -n 100 {} \;

  backend-e2e:
    name: Backend E2E (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blujet
          POSTGRES_PASSWORD: blujet
          POSTGRES_DB: blujet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blujet -d blujet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: cp .env.test .env
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  ml-service:
    name: ML service
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - experience-service
      - loyalty-service
      - agency-service
      - identity-service
      - notify-service
      - backend-migration-compatibility
      - pss-service
      - backend
      - backend-kafka
      - backend-e2e
      - frontend
      - ml-service
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require every selected job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
